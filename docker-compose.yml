services:
  postgres:
    image: postgres:16-alpine
    container_name: evraz_postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  service:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    command: sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000"
    networks:
      - app_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: evraz_frontend
    ports:
      - "8080:80"
      - "80:80"
    depends_on:
      - service
    networks:
      - app_network

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: evraz_prometheus
    volumes:
      - ./scripts/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - service
    networks:
      - app_network

  grafana:
    image: grafana/grafana:11.1.0
    container_name: evraz_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/evraz.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./scripts/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./scripts/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./scripts/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - app_network

volumes:
  pgdata:
  grafana_data:

networks:
  app_network:
    driver: bridge