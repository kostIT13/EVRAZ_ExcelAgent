name: Golden Dataset CI

# Прогон golden-датасета (эталонные вопросы) при каждом изменении промптов,
# схемы, нормализации или самих вопросов — как заявлено в презентации проекта.
#
# Для golden-job необходимы GitHub Secrets:
#   LLM_BASE_URL, LLM_API_KEY, LLM_MODEL_PRIMARY
# Без них job упадёт на шаге «Прогон golden-датасета» — это ожидаемо:
# golden-тесты требуют живую LLM-модель.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit-tests:
    name: Юнит-тесты (без LLM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Установка зависимостей
        run: pip install -e .
      - name: Юнит-тесты
        run: pytest tests/ -m "not golden" -v

  golden:
    name: Golden-прогон (LLM + данные)
    needs: unit-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: evraz
          POSTGRES_PASSWORD: evraz_secret
          POSTGRES_DB: evraz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evraz -d evraz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      POSTGRES_URL: postgresql+asyncpg://evraz:evraz_secret@localhost:5432/evraz
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: evraz
      POSTGRES_PASSWORD: evraz_secret
      POSTGRES_DB: evraz
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL_PRIMARY: ${{ secrets.LLM_MODEL_PRIMARY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Установка зависимостей
        run: |
          pip install -e .
          sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Расширения PostgreSQL
        run: >
          PGPASSWORD=evraz_secret psql -h localhost -U evraz -d evraz
          -v ON_ERROR_STOP=1 -f scripts/init-db/01-extensions.sql
      - name: Миграции
        run: alembic upgrade head
      - name: Загрузка демо-данных
        run: python scripts/load_demo_data.py --check-mart
      - name: Прогон golden-датасета
        run: pytest -m golden tests/test_golden_dataset.py -v
      - name: Отчёт по точности
        run: python scripts/run_golden_report.py --limit 5
        continue-on-error: true