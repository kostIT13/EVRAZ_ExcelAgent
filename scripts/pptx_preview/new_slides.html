<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>EVRAZ Agent — новые слайды</title>
<style>
  body { background:#111; color:#eee; font-family: Arial, sans-serif; margin:0; padding:20px; }
  h1 { text-align:center; color:#FF5A36; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(560px, 1fr)); gap:20px; }
  .card { background:#1B1F24; border:1px solid #3D4A57; border-radius:8px; padding:10px; }
  .card h3 { margin:0 0 8px 0; font-size:14px; color:#8A97A6; }
  .card img { width:100%; border-radius:4px; display:block; }
</style>
</head>
<body>
<h1>EVRAZ Agent — новые слайды (25, 27, 28)</h1>
<div class="grid">
  <div class="card"><h3>Слайд 25 — Метрики качества</h3><img src="new_slide_25.png" alt="slide 25"></div>
  <div class="card"><h3>Слайд 27 — Примеры запросов</h3><img src="new_slide_27.png" alt="slide 27"></div>
  <div class="card"><h3>Слайд 28 — Динамика цен</h3><img src="new_slide_28.png" alt="slide 28"></div>
</div>
</body>
</html>
